<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Écran de chargement DarkRP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- STYLE VISUEL (CSS) --- */
        body {
            /* Remplace l'URL ci-dessous par le lien direct de ton image de fond */
            background-image: url('https://i.ibb.co/x8gNNgP6/20260309210426-1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Roboto', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* La boîte centrale semi-transparente */
        .container {
            background-color: rgba(0, 0, 0, 0.7); /* Noir à 70% d'opacité */
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 600px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            /* Effet de flou en arrière-plan (ne marche pas sur tous les vieux navigateurs, mais rend bien) */
            backdrop-filter: blur(5px); 
        }

        h1 {
            color: #ff9f43; /* Couleur orange/dorée pour le titre */
            margin-top: 0;
            font-size: 32px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 18px;
            font-weight: 400;
            color: #c8d6e5;
            margin-bottom: 30px;
        }

        /* Style de la barre de progression (le contour) */
        .progress-bar-container {
            width: 100%;
            background-color: #222f3e;
            border-radius: 25px;
            padding: 3px;
            margin-bottom: 15px;
        }

        /* Style du remplissage de la barre */
        .progress-bar-fill {
            height: 20px;
            background-color: #ff9f43;
            border-radius: 20px;
            width: 0%; /* Ça commencera à 0% */
            transition: width 0.3s ease; /* Animation fluide lors du remplissage */
        }

        #status {
            font-size: 14px;
            font-style: italic;
            color: #8395a7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="server-name">Connexion au serveur...</h1>
        <h2 id="map-name">Chargement de la carte...</h2>

        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        
        <div id="status">Préparation du téléchargement...</div>
    </div>

    <script>
        // Variables pour calculer le pourcentage
        var totalFiles = 0;
        var filesNeeded = 0;

        // Fonction appelée par GMod pour donner les détails du serveur
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('server-name').innerText = servername;
            document.getElementById('map-name').innerText = "Map : " + mapname;
        }

        // Fonction appelée par GMod quand le texte de statut change
        function SetStatusChanged(status) {
            document.getElementById('status').innerText = status;
        }

        // Fonction appelée par GMod pour définir le nombre total de fichiers à télécharger
        function SetFilesTotal(total) {
            totalFiles = Math.max(0, total);
        }

        // Fonction appelée par GMod à chaque fois qu'un fichier est téléchargé
        function SetFilesNeeded(needed) {
            filesNeeded = Math.max(0, needed);
            UpdateProgressBar();
        }

        // Notre fonction personnalisée pour calculer et afficher le pourcentage
        function UpdateProgressBar() {
            if (totalFiles > 0) {
                // On calcule combien de fichiers ont été téléchargés
                var filesDownloaded = totalFiles - filesNeeded;
                // On calcule le pourcentage
                var percentage = Math.round((filesDownloaded / totalFiles) * 100);
                
                // On met à jour la largeur de la barre en CSS
                document.getElementById('progress-fill').style.width = percentage + "%";
            }
        }
    </script>

</body>
</html>
